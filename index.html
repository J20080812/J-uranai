<!DOCTYPE html>

<head>

<title>J｜占い鑑定</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#222;background:#fafafa;line-height:1.8}
.container{max-width:900px;margin:auto;padding:0 22px}.hero{min-height:72vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff}
.logo{font-family:Georgia,serif;font-size:110px;line-height:1;margin-bottom:15px}h1{font-size:28px;letter-spacing:.12em;margin:0 0 12px}.lead{color:#666;margin:0}

</div><p class="note">※キャンペーン期間中は20分・40分が無料です。60分は通常料金です。</p></div></section>
